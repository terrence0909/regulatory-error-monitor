version: 2

models:
  - name: dim_error
    description: Error codes with full history. One row per version, with valid_from and valid_to dates.
    columns:
      - name: error_version_key
        data_tests: [unique, not_null]
      - name: error_code
        data_tests: [not_null]
      - name: error_level
        data_tests:
          - accepted_values:
              arguments:
                values: ['Warning', 'Error', 'Critical']
      - name: error_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Format', 'Limit', 'Missing value', 'Reference data', 'Duplicate', 'Timing']
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_rule
    description: Rules with full history. One row per version.
    columns:
      - name: rule_key
        data_tests: [unique, not_null]
      - name: rule_skey
        data_tests: [not_null]

  - name: dim_file
    description: Files received.
    columns:
      - name: file_key
        data_tests: [unique, not_null]

  - name: dim_reporting_entity
    description: The institutions that send reports. The entity code is the key.
    columns:
      - name: entity_code
        data_tests: [unique, not_null]

  - name: dim_date
    description: One row per calendar day.
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fact_validation_error
    description: One row per validation error on one transaction line.
    columns:
      - name: validation_error_key
        data_tests: [unique, not_null]
      - name: error_version_key
        description: The error version that was valid on the day the row was created.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_error')
                field: error_version_key
      - name: rule_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rule')
                field: rule_key
      - name: file_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_file')
                field: file_key
      - name: entity_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reporting_entity')
                field: entity_code
      - name: created_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: error_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Open', 'Cleared']
      - name: transaction_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Pending', 'Reported']
      - name: created_at
        data_tests: [not_null]