version: 2

sources:
  - name: raw
    description: Data exactly as the loader brought it in. Every batch is kept, so the same row can appear more than once.
    schema: raw
    loaded_at_field: loaded_at
    freshness:
      warn_after: {count: 2, period: day}
    tables:
      - name: error_detail
      - name: validation_rule
      - name: file_registry
      - name: transaction_validation

  - name: audit
    description: What the loader did.
    schema: audit
    tables:
      - name: load_log

  - name: quarantine
    description: Rows the loader refused, with the reason.
    schema: quarantine
    tables:
      - name: rejected_rows