# Phase 2: PostgreSQL only. Airflow and the dashboard are added in later phases.
services:
  postgres:
    image: postgres:16.4
    container_name: reg_monitor_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: your data survives restarts and "docker compose down"
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, in filename order, the first time the database is created
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: