# Phase 7: PostgreSQL for the data, plus Airflow to run the pipeline every day.
#
# Start everything:   docker compose up -d
# Airflow web page:   http://localhost:8080   (user: admin, password: AIRFLOW_ADMIN_PASSWORD from .env)

x-airflow-common: &airflow-common
  build: ./airflow
  image: reg-monitor-airflow:local
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: reg-monitor-local-dev-key
    AIRFLOW__WEBSERVER__WORKERS: "2"
    # Inside Docker the data database is reached by its service name, on its normal port.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # Where things are inside the Airflow containers.
    PROJECT_DIR: /opt/project
    DBT_BIN: /home/airflow/dbt_venv/bin/dbt
    DBT_TARGET_PATH: /opt/airflow/dbt_work/target
    DBT_LOG_PATH: /opt/airflow/dbt_work/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
    DO_NOT_TRACK: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./:/opt/project
    - airflow_logs:/opt/airflow/logs
    - dbt_work:/opt/airflow/dbt_work

services:
  postgres:
    image: postgres:16.4
    container_name: reg_monitor_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: your data survives restarts and "docker compose down"
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, in filename order, the first time the database is created
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Airflow keeps its own bookkeeping (which days ran, which tasks failed) in a separate database.
  airflow_db:
    image: postgres:16.4
    container_name: reg_monitor_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: prepares Airflow's database and creates the admin login.
  airflow-init:
    <<: *airflow-common
    container_name: reg_monitor_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          || echo "Admin user already exists")
    depends_on:
      airflow_db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: reg_monitor_airflow_web
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: reg_monitor_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  airflow_db_data:
  airflow_logs:
  dbt_work: